<div class="p-8 bg-gray-50 min-h-screen">
  <div class="mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
    <input 
      type="text" 
      [(ngModel)]="searchTerm" 
      (input)="onSearch()" 
      placeholder="Search by customer name..." 
      class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all"
    >
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-50 text-gray-400 text-xs uppercase">
        <tr>
          <th class="px-6 py-4">Customer Name</th>
          <th class="px-6 py-4">Email</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-50 text-gray-800">
        @for (user of filteredusers; track user.id) {
          <tr class="hover:bg-gray-50/50">
            <td class="px-6 py-4 font-bold">{{ user.name }}</td>
            <td class="px-6 py-4">{{ user.email }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="2" class="px-6 py-10 text-center text-gray-400">
              مفيش نتائج "{{ searchTerm }}"
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
