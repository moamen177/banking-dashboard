<div class="p-4 md:p-6 bg-slate-50/50">
  
  <div class="mb-5 max-w-xl">
    <div class="relative group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-500 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <input 
        type="text" 
        [(ngModel)]="searchTerm" 
        (input)="onSearch()" 
        placeholder="Search customers..." 
        class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500/10 focus:border-indigo-500 transition-all text-sm font-medium text-slate-700 shadow-sm"
      >
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead>
          <tr class="bg-slate-50/50 text-slate-400 text-[10px] uppercase font-bold tracking-widest border-b border-slate-100">
            <th class="px-6 py-3">Customer</th>
            <th class="px-6 py-3">Email Address</th>
            <th class="px-6 py-3 text-right">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-50">
          @for (user of filteredusers; track user.id) {
            <tr class="hover:bg-slate-50/80 transition-colors group">
              <td class="px-6 py-3.5">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 bg-indigo-50 text-indigo-600 rounded-lg flex items-center justify-center text-xs font-black">
                    {{ user.name.charAt(0) }}
                  </div>
                  <span class="text-sm font-bold text-slate-900 leading-none">{{ user.name }}</span>
                </div>
              </td>
              <td class="px-6 py-3.5 text-sm text-slate-500 font-medium">{{ user.email }}</td>
              <td class="px-6 py-3.5 text-right">
                <button class="text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors">Details</button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="px-6 py-12 text-center text-slate-400">
                <p class="text-sm font-medium">No results for "{{ searchTerm }}"</p>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
