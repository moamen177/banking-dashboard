<div class="bg-white rounded-[24px] border border-slate-100 shadow-sm overflow-hidden transition-all duration-300">
  <div class="p-6 border-b border-slate-50 flex justify-between items-center bg-white">
    <div class="flex items-center gap-2">
      <div class="w-2 h-6 bg-indigo-600 rounded-full"></div>
      <h3 class="text-lg font-black text-slate-900 tracking-tight">Recent Transactions</h3>
    </div>
    <button class="text-indigo-600 text-xs font-bold uppercase tracking-widest hover:text-indigo-700 transition-colors">View All</button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-slate-50/50 text-slate-400 text-[10px] uppercase font-bold tracking-[0.15em]">
          <th class="px-6 py-4">Transaction</th>
          <th class="px-6 py-4">Date</th>
          <th class="px-6 py-4">Amount</th>
          <th class="px-6 py-4">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-50">
        @for (item of recentTransactions; track item.id) {
          <tr class="hover:bg-indigo-50/30 transition-colors group">
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-slate-100 rounded-xl flex items-center justify-center group-hover:bg-indigo-100 transition-colors">
                  <span class="text-slate-500 font-bold text-xs group-hover:text-indigo-600">{{ item.name.charAt(0) }}</span>
                </div>
                <div class="flex flex-col">
                  <span class="text-sm font-bold text-slate-900">{{ item.name }}</span>
                  <span class="text-[10px] text-slate-400 font-medium italic">Internal Transfer</span>
                </div>
              </div>
            </td>
            <td class="px-6 py-4 text-xs font-medium text-slate-500">{{ item.date }}</td>
            <td class="px-6 py-4">
              <span class="text-sm font-black text-slate-900">${{ item.amount }}</span>
            </td>
            <td class="px-6 py-4">
              <span [ngClass]="{
                'bg-emerald-50 text-emerald-600 border-emerald-100': item.status === 'Completed',
                'bg-amber-50 text-amber-600 border-amber-100': item.status === 'Pending'
              }" class="px-3 py-1 rounded-lg border text-[10px] font-black uppercase tracking-tighter shadow-sm">
                {{ item.status }}
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
