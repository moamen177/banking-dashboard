<div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
  <div class="p-4 md:p-6 border-b border-gray-50 flex justify-between items-center">
    <h3 class="text-base md:text-lg font-bold text-gray-900">Recent Transactions</h3>
    <button class="text-blue-600 text-xs md:text-sm font-medium hover:underline">View All</button>
  </div>

  <div class="overflow-x-auto">

    <table class="w-full text-left min-w-[600px]">
      <thead class="bg-gray-50 text-gray-400 text-[10px] md:text-xs uppercase font-semibold">
        <tr>
          <th class="px-4 md:px-6 py-4">Transaction</th>
          <th class="px-4 md:px-6 py-4">Date</th>
          <th class="px-4 md:px-6 py-4">Amount</th>
          <th class="px-4 md:px-6 py-4">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-50">
        @for (item of recentTransactions; track item.id) {
          <tr class="hover:bg-gray-50/50 transition-colors">
            <td class="px-4 md:px-6 py-4">
              <div class="flex items-center gap-2 md:gap-3">
                <div class="w-7 h-7 md:w-8 md:h-8 bg-gray-100 rounded-full flex items-center justify-center flex-shrink-0">
                  <svg class="w-3 h-3 md:w-4 md:h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                  </svg>
                </div>
                <span class="text-xs md:text-sm font-bold text-gray-900 truncate max-w-[120px] md:max-w-none">{{ item.name }}</span>
              </div>
            </td>
            <td class="px-4 md:px-6 py-4 text-xs md:text-sm text-gray-500">{{ item.date }}</td>
            <td class="px-4 md:px-6 py-4 font-bold text-xs md:text-sm text-gray-900">${{ item.amount }}</td>
            <td class="px-4 md:px-6 py-4">
              <span [ngClass]="{
                'bg-green-50 text-green-600': item.status === 'Completed',
                'bg-yellow-50 text-yellow-600': item.status === 'Pending'
              }" class="px-2 md:px-3 py-1 rounded-full text-[9px] md:text-[10px] font-bold uppercase whitespace-nowrap">
                {{ item.status }}
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
