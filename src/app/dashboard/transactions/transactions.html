<div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
  <div class="p-6 border-b border-gray-50 flex justify-between items-center">
    <h3 class="text-lg font-bold text-gray-900">Recent Transactions</h3>
    <button class="text-blue-600 text-sm font-medium hover:underline">View All</button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left min-w-[600px]">
      <thead class="bg-gray-50 text-gray-400 text-xs uppercase font-semibold">
        <tr>
          <th class="px-6 py-4">Transaction</th>
          <th class="px-6 py-4">Date</th>
          <th class="px-6 py-4">Amount</th>
          <th class="px-6 py-4">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-50">
        @for (item of recentTransactions; track item.id) {
          <tr class="hover:bg-gray-50/50 transition-colors">
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
