<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10 w-full">
  @for (item of stats; track item.title) {
    <div class="group bg-white p-6 rounded-[24px] border border-slate-100 hover:border-indigo-100 hover:shadow-xl hover:shadow-indigo-500/5 transition-all duration-300 relative overflow-hidden cursor-default">
      
      <div class="absolute -right-2 -top-2 w-16 h-16 bg-slate-50 rounded-full scale-0 group-hover:scale-100 transition-transform duration-500 ease-out"></div>

      <div class="flex flex-col gap-4 relative z-10">
        <div class="flex items-center justify-between">
          <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">{{ item.title }}</p>
          <div [ngClass]="{
            'bg-indigo-50 text-indigo-600': item.title === 'Balance',
            'bg-emerald-50 text-emerald-600': item.title === 'Income',
            'bg-rose-50 text-rose-600': item.title === 'Expenses',
            'bg-slate-100 text-slate-600': item.title === 'Total Customers'
          }" class="w-10 h-10 rounded-xl flex items-center justify-center transition-transform group-hover:rotate-12">
            <svg *ngIf="item.title === 'Balance'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
            <svg *ngIf="item.title === 'Income'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
            <svg *ngIf="item.title === 'Expenses'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path></svg>
            <svg *ngIf="item.title === 'Total Customers'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
          </div>
        </div>
        
        <div>
          <h3 class="text-2xl font-black tracking-tight text-slate-900">
            <span class="text-sm font-medium text-slate-400 mr-1">{{ item.title !== 'Total Customers' ? 'EGP' : '' }}</span>{{ item.value | number }}
          </h3>
          <div class="mt-2 flex items-center gap-1">
            <span class="text-[10px] font-bold text-emerald-500 bg-emerald-50 px-1.5 py-0.5 rounded">+2.5%</span>
            <span class="text-[10px] text-slate-400 font-medium">vs last month</span>
          </div>
        </div>
      </div>
    </div>
  }
</div>
