<div class="p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <div class="flex flex-col gap-1">
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Account Settings</h1>
      <p class="text-slate-400 text-sm font-medium">Manage your profile and security preferences.</p>
    </div>

    <div class="bg-white rounded-[24px] border border-slate-100 shadow-sm overflow-hidden">
      <div class="p-8">
        <div class="flex items-center gap-3 mb-8">
          <div class="w-1.5 h-6 bg-indigo-600 rounded-full"></div>
          <h2 class="text-lg font-bold text-slate-900">Profile Information</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
          
          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-wider ml-1">Full Name</label>
            <input type="text" [(ngModel)]="userProfile.name" 
                   class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all text-sm font-semibold text-slate-700">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-wider ml-1">Email Address</label>
            <input type="email" [(ngModel)]="userProfile.email" 
                   class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all text-sm font-semibold text-slate-700">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-wider ml-1">Phone Number</label>
            <input type="text" [(ngModel)]="userProfile.phone" 
                   class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all text-sm font-semibold text-slate-700">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-wider ml-1">Language</label>
            <div class="relative">
              <select [(ngModel)]="userProfile.language" 
                      class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none appearance-none transition-all text-sm font-semibold text-slate-700">
                <option>English</option>
                <option>Arabic</option>
              </select>
              <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </div>
          </div>
          
        </div>
      </div>

      <div class="p-6 bg-slate-50/50 border-t border-slate-100 flex justify-end gap-3">
        <button class="px-6 py-2.5 text-sm font-bold text-slate-500 hover:text-slate-700 transition-colors">
          Cancel
        </button>
        <button (click)="saveSettings()" 
                class="px-8 py-2.5 bg-indigo-600 text-white text-sm font-black rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all active:scale-95">
          Save Changes
        </button>
      </div>
    </div>
  </div>
</div>
